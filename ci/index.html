<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCMRS | Citizen Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
    <img src="media/logo.png" alt="Logo">
    <h2>RCMRS</h2>
</div>
        <div class="nav-links">
            <a href="index.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <div class="auth-card">
        <h2>Citizen Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="e.g. nima@rcmrs.bt" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div id="msg"></div>
        </form>
        <p style="text-align:center; margin-top:1rem; font-size:0.9rem;">
            Don't have an account? <a href="signup.html" style="color:#3498db;">Sign up here</a>
        </p>
        <p style="text-align:center; margin-top:1rem; font-size:0.78rem; color:#999;">
            Demo: nima@rcmrs.bt / 1234
        </p>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const pass  = document.getElementById("password").value;
            const user  = getUsers().find(u => u.email === email && u.password === pass);
            const msg   = document.getElementById("msg");

            if (!user) {
                msg.innerHTML = `<div class="alert alert-error">Invalid email or password.</div>`;
                return;
            }
            if (user.role !== "Citizen") {
                msg.innerHTML = `<div class="alert alert-error">This login is only for citizens.</div>`;
                return;
            }

            localStorage.setItem("currentUserId", user.id);
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
